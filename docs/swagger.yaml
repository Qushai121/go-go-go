paths:
  /api/attendance:
    get:
      consumes:
      - application/json
      description: Get all attendance with pagination
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all attendance
      tags:
      - Attendance
    post:
      consumes:
      - multipart/form-data
      description: Create attendance with photo upload
      parameters:
      - description: Activity (WFH, VISIT, OFFICE)
        enum:
        - WFH
        - VISIT
        - OFFICE
        in: formData
        name: activity
        required: true
        type: string
      - description: Check type (1=IN, 2=OUT)
        enum:
        - "1"
        - "2"
        in: formData
        name: check_type
        required: true
        type: string
      - description: Photo file
        in: formData
        name: photo_url
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create attendance
      tags:
      - Attendance
  /api/attendance/me:
    get:
      consumes:
      - application/json
      description: Get attendance by logged-in user
      parameters:
      - description: Page number
