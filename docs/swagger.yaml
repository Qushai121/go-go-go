  title: HRMS API
  version: "1.0"
paths:
  /api/approval:
    get:
      consumes:
      - application/json
      description: Get all approval header with pagination & search
      parameters:
      - description: Sort order (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: Sort by column
        in: query
        name: sort_by
        type: string
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Field name for dynamic search
        in: query
        name: field_search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all approvals
      tags:
      - Approval
  /api/approval/{id}:
    delete:
      consumes:
      - application/json
      description: Delete approval header by ID
      parameters:
      - description: Approval Header ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete approval
      tags:
      - Approval
    get:
      consumes:
      - application/json
      description: Get approval header detail by ID
      parameters:
      - description: Approval Header ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
