      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get approval detail
      tags:
      - Approval
  /api/approval/approve:
    post:
      consumes:
      - application/json
      description: Insert or update approval detail (upsert)
      parameters:
      - description: Approval Detail Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/approval.PostApproveDto'
      produces:
