    post:
      consumes:
      - multipart/form-data
      description: Create attendance with photo upload
      parameters:
      - description: User ID (UUID)
        in: formData
        name: user_id
        type: string
      - description: Device ID
        in: formData
        name: device_id
        type: string
      - description: Activity
        enum:
        - WFH
        - VISIT
        - OFFICE
        in: formData
        name: activity
        required: true
        type: string
      - description: Check type
        enum:
        - "1"
        - "2"
        in: formData
        name: check_type
        required: true
        type: string
      - description: Description
        in: formData
        name: check_description
        type: string
      - description: Shift code
        in: formData
        name: shift_code
        type: string
      - description: Shift duration
        in: formData
        name: shift_duration_hours
        type: integer
      - description: Date (YYYY-MM-DD)
        in: formData
        name: date
        required: true
        type: string
      - description: Time (HH:mm:ss)
        in: formData
        name: time
        required: true
        type: string
      - description: Location code
        in: formData
        name: location_code
        type: string
      - description: Location name
        in: formData
        name: location_name
        type: string
      - description: Latitude
        in: formData
        name: latitude
        type: number
      - description: Longitude
        in: formData
        name: longitude
        type: number
      - description: GPS accuracy
        in: formData
        name: gps_accuracy
        type: number
      - description: Mock location
        in: formData
        name: is_mock_location
        type: boolean
      - description: Notes
        in: formData
        name: notes
        type: string
      - description: Photo
        in: formData
        name: photo_url
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create attendance
      tags:
      - Attendance
