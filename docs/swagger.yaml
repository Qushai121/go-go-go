    post:
      consumes:
      - multipart/form-data
      description: Create attendance with photo upload
      parameters:
      - description: User ID (UUID). If empty, taken from auth token.
        in: formData
        name: user_id
        type: string
      - description: Company code
        in: formData
        name: company_code
        type: string
      - description: 'Site type: BRANCH/OFFICE/CUSTOMER'
        in: formData
        name: site_type
        type: string
      - description: Site code
        in: formData
        name: site_code
        required: true
        type: string
      - description: Log time (YYYY-MM-DD HH:mm:ss or RFC3339)
        in: formData
        name: logtime
        required: true
        type: string
      - description: Function number
        in: formData
        name: functionno
        required: true
        type: integer
      - description: Action type
        in: formData
        name: action_type
        type: string
      - description: Latitude
        in: formData
        name: latitude
        type: string
      - description: Longitude
        in: formData
